<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta tags -->
    <meta
      name="description"
      content="Partida em andamento do Jogo da Velha. Faça sua jogada e vença!"
    />
    <meta name="author" content="André" />
    <meta name="robots" content="noindex, follow" />

    <!-- Open Graph (Redes Sociais) -->
    <meta property="og:title" content="Jogo da Velha - Partida" />
    <meta
      property="og:description"
      content="Desafie seu oponente no Jogo da Velha!"
    />
    <meta property="og:image" content="img/velha.png" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" type="image/x-icon" href="img/icon.png" />
    <title>Jogo da Velha</title>
  </head>
  <body>
    <main class="espace_game">
      <div></div>
      <div class="board" data-board>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
      </div>

      <div class="winning-message" data-winning-message>
        <p class="winning-message-text" data-winning-message-text>X Venceu!</p>
        <button class="winning-message-button" data-restart-button>
          Reiniciar!
        </button>
      </div>
    </main>

    <footer>
      <button class="centralizar-botao" onclick="history.back()">SAIR</button>
    </footer>

    <script src="Js/scripts.js"></script>
  </body>
</html>
